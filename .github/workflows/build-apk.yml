name: Compiler l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Vérifie aussi que gradle-wrapper.jar est bien l'officiel
      - uses: gradle/actions/setup-gradle@v4

      # Avec les secrets CARHOME_KEYSTORE_BASE64 et CARHOME_KEYSTORE_PASSWORD : version release signée avec la clé fixe.
      # Sans : version debug (clé temporaire, les mises à jour demandent de désinstaller).
      - name: Compiler
        env:
          CARHOME_KEYSTORE_PASSWORD: ${{ secrets.CARHOME_KEYSTORE_PASSWORD }}
          CARHOME_KEYSTORE_BASE64: ${{ secrets.CARHOME_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          missing=""
          [ -n "$CARHOME_KEYSTORE_BASE64" ] || missing="$missing CARHOME_KEYSTORE_BASE64"
          [ -n "$CARHOME_KEYSTORE_PASSWORD" ] || missing="$missing CARHOME_KEYSTORE_PASSWORD"
          if [ -z "$missing" ]; then
            echo "$CARHOME_KEYSTORE_BASE64" | base64 -d > app/carhome-release.p12
            ./gradlew assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk CarHome.apk
            echo "BUILD_KIND=release signée" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret(s) manquant(s) :$missing. Compilation debug (clé temporaire)."
            unset CARHOME_KEYSTORE_PASSWORD
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk CarHome.apk
            echo "BUILD_KIND=debug (clé temporaire)" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CarHome-apk
          path: CarHome.apk

      # Page de téléchargement direct : Releases > "CarHome (dernière version)"
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest CarHome.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "CarHome (dernière version)" \
            --notes "Version 1.${GITHUB_RUN_NUMBER}, ${BUILD_KIND}. Compilée depuis la branche ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7})."
